apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-api
  namespace: dispatch
  labels:
    app: shipment-api
    owner: fulfillment-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipment-api
  template:
    metadata:
      labels:
        app: shipment-api
        owner: fulfillment-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -text=ok
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 700m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-api
  namespace: dispatch
  labels:
    app: shipment-api
    owner: fulfillment-team
spec:
  selector:
    app: shipment-api
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: dispatch
  labels:
    app: catalog-api
    owner: catalog-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
        owner: catalog-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8081
        - -text=ok
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: dispatch
  labels:
    app: catalog-api
    owner: catalog-team
spec:
  selector:
    app: catalog-api
  ports:
  - port: 80
    targetPort: 8081
