apiVersion: v1
kind: Service
metadata:
  name: shipment-api
  namespace: dispatch
  labels:
    app: shipment-api
    owner: fulfillment-team
spec:
  clusterIP: None
  selector:
    app: shipment-api
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shipment-api
  namespace: dispatch
  labels:
    app: shipment-api
    owner: fulfillment-team
spec:
  serviceName: shipment-api
  replicas: 2
  selector:
    matchLabels:
      app: shipment-api
  template:
    metadata:
      labels:
        app: shipment-api
        owner: fulfillment-team
    spec:
      nodeSelector:
        devops-bench/run: ${CLUSTER_NAME}
      tolerations:
      - key: devops-bench/run
        value: ${CLUSTER_NAME}
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: shipment-api
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -text=ok
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: dispatch
  labels:
    app: settlement-worker
    owner: finance-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-worker
  template:
    metadata:
      labels:
        app: settlement-worker
        owner: finance-platform
    spec:
      nodeSelector:
        devops-bench/run: ${CLUSTER_NAME}
      tolerations:
      - key: devops-bench/run
        value: ${CLUSTER_NAME}
        effect: NoSchedule
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                statefulset.kubernetes.io/pod-name: shipment-api-1
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8081
        - -text=ok
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-worker
  namespace: dispatch
  labels:
    app: settlement-worker
    owner: finance-platform
spec:
  selector:
    app: settlement-worker
  ports:
  - port: 80
    targetPort: 8081
