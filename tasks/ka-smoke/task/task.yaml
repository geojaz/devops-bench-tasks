# task_id is hand-authored, not derived by compiler/task.py's
# derive_task_id: this task has no inventory/blueprints/<id> catalog entry
# (its prompt and verification_spec are kube-agents' own kanban tool call,
# not a kube-api condition/fragment this factory's compiler model can
# express), so it never goes through `compiler.compile`. The bench's
# Task.id field is a plain string, so "ka-smoke" needs no numeric suffix.
task_id: "ka-smoke"
# task_version: bumped only on a semantic change (verification_spec,
# prompt, or stack/seed behavior); doc-only edits do not bump it.
task_version: 1
name: "Agent kanban smoke test"
infrastructure:
  # deployer: tofu -- the stack under out/emitted/ka-smoke/stack/ is meant
  # to be copied into the bench repo's tf/prebuilt/<stack> (see
  # compiler/stack.py); the bench's get_deployer() resolves this stack name
  # against that directory.
  #
  # provider: gcp -- kube-agents' credential proxy only knows how to
  # authenticate against GKE (its bootstrap always shells out to `gcloud
  # container clusters get-credentials`; see docs/fleet.md's "kube-agents on
  # GKE" and fleet/campaigns/kubeagents-gke.yaml), so this task stands up a
  # bare GKE cluster with no seeded workload. The cluster exists only to
  # give the harness a live kubeconfig context to bootstrap the credential
  # proxy against; the probe itself never touches a Kubernetes resource.
  deployer: "tofu"
  stack: "prebuilt/ka-smoke"
  provider: "gcp"
  teardown: true
  variables:
    node_count: 1

# prompt and expected_output below are copied verbatim from kube-agents'
# own bench/tasks/agent-kanban-smoke/task.yaml: it exercises the eval
# pipeline end to end without provisioning infrastructure, using only the
# capability the deployed platform agent actually ships with. The agent's
# config (both the image default and the operator-rendered production
# ConfigMap) denylists terminal/file/shell toolsets and enables kanban, so
# the probe has to be a kanban action; a task that asks for shell access
# scores 0 against any real deployment.
prompt: >-
  Create a kanban task titled exactly "devops-bench smoke probe", then state in
  one sentence the id that was assigned to it.
expected_output: >-
  A kanban task titled "devops-bench smoke probe" is created via the kanban
  tooling, and the final message states the id assigned to it.

# verification_spec below is copied verbatim from kube-agents' own
# task.yaml. The title was chosen for this probe, so an exact match is
# fair. The kanban_create call is the whole point of the probe: a green
# judge score with no kanban call would mean the agent talked about
# creating a task instead of creating it.
verification_spec:
  - name: report-states-the-probe-title
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      required_phrases: ["devops-bench smoke probe"]
  - name: the-kanban-card-was-actually-filed
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      # An errored kanban_create filed no card, so only successful
      # calls count toward this objective.
      require_success: true
